<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uwuw Pets</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font bergaya santai/bulat agar cocok dengan tema hewan lucu -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome untuk ikon media sosial di footer -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- HEADER (Polos tanpa tombol sesuai permintaan) -->
    <header>
        <div class="header-container">
            <span class="brand-name">Uwuw Pets</span>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="watermark-text">@uwuw.pets</h1>
            <a href="https://play.google.com/" target="_blank" class="playstore-btn">
                <img src="assets/playstore.png" alt="Get it on Google Play">
            </a>
        </div>
    </section>

    <!-- GRID MENU (4 Kotak Konten Utama) -->
    <section class="grid-section">
        <div class="grid-container">
            <!-- Kotak 1: Bikin KTP -->
            <div class="grid-card card-ktp">
                <div class="card-overlay">
                    <h2>bikin KTP</h2>
                    <p>Kartu Tanda Pet</p>
                </div>
            </div>

            <!-- Kotak 2: Riwayat Kesehatan -->
            <div class="grid-card card-medik">
                <div class="card-overlay">
                    <h2>riwayat kesehatan</h2>
                    <p>Rekam Medik</p>
                </div>
            </div>

            <!-- Kotak 3: Biar Inget -->
            <div class="grid-card card-inget">
                <div class="card-overlay">
                    <h2>biar inget</h2>
                    <p>Pengingat Mandi & Rawat</p>
                </div>
            </div>

            <!-- Kotak 4: Foto-Foto -->
            <div class="grid-card card-foto">
                <div class="card-overlay">
                    <h2>foto foto..</h2>
                    <p>Galeri Peliharaan</p>
                </div>
            </div>
        </div>
    </section>

    <!-- FORM PESAN WEBMASTER (Sebelum Footer) -->
    <section class="contact-section">
        <div class="contact-container">
            <h3>Kirim Pesan ke Webmaster</h3>
            <form action="#" method="POST" class="contact-form">
                <input type="text" name="nama" placeholder="Nama Anda" required>
                <input type="email" name="email" placeholder="Email Anda" required>
                <textarea name="pesan" rows="4" placeholder="Tulis pesan Anda di sini..." required></textarea>
                <button type="submit">Kirim Pesan</button>
            </form>
        </div>
    </section>

    <!-- FOOTER (Dengan Link Media Sosial) -->
    <footer>
        <div class="footer-container">
            <div class="social-links">
                <a href="https://instagram.com" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://tiktok.com" target="_blank" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://twitter.com" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="https://youtube.com/" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            </div>
            <p>&copy; 2026 Uwuw Pets. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
